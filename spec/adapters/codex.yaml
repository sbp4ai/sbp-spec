adapter: codex@1
agent: codex
display: OpenAI Codex CLI
match:
  cmd: ["codex"]
  version: ">=0.20"
  detect: {screen: "codex|OpenAI Codex"}

transport:
  type: tmux
  target: "cx-{{sid}}"
  capture: {mode: screen, rows: 44, cols: 108, interval_ms: 500}
  spawn:
    exec: "tmux new-session -d -s cx-{{sid}} -x {{cols}} -y {{rows}} -c {{cwd}} 'codex'"

state:
  busy:    {regex: "Working|⠋|⠙|thinking"}
  idle:    {regex: "^\\s*›\\s*$|^\\s*codex>\\s*$"}
  waiting: {regex: "Allow command\\?|\\[y/N\\]|\\(y\\)es"}

parse:
  prompt: {regex: "^\\s*›\\s*$"}
  choice:
    regex: "^\\s*[›>]?\\s*(\\d+)[.)]\\s+(.+?)\\s*$"
    group_index: 1
    group_label: 2

semantics:
  input.text:      {write: "{{text}}", submit: "\r"}
  input.key:       {keys: {"UP": "\u001b[A", "DOWN": "\u001b[B", "ENTER": "\r", "ESC": "\u001b", "TAB": "\t"}}
  input.choice:    {write: "{{index}}", submit: "\r"}
  input.approve:   {write: "{{yes_no}}", submit: "\r", "yes": "y", "no": "n"}
  input.interrupt: {write: "\u0003"}
  session.snapshot: {exec: "tmux capture-pane -p -t cx-{{sid}} -S -{{rows}}"}
  session.spawn:   {exec: "tmux new-session -d -s cx-{{sid}} -x {{cols}} -y {{rows}} -c {{cwd}} 'codex'"}
  session.list:    {exec: "tmux list-sessions -F '#{session_name}'"}

guards:
  confirm_regex: "(rm -rf|--force|sudo )"

caps: [session.list, session.spawn, input.text, input.key, input.choice, input.approve, input.interrupt, output.screen, screen.snapshot]
